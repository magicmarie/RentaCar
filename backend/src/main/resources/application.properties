spring.application.name=renta-car

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT
rentacar.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
rentacar.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
rentacar.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Mail
rentacar.mail.from=${MAIL_FROM:no-reply@rentacar.com}
rentacar.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
